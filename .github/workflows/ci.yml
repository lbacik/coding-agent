name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # Fails when uv.lock is out of date with pyproject.toml instead of
      # rewriting it.
      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run --locked pytest -q

      - name: Type check
        run: uv run --locked mypy src tests
