name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # Fails when uv.lock is out of date with pyproject.toml instead of
      # rewriting it.
      - name: Install
        run: uv sync --locked

      # The `requires_real_installer` rows (draft round-trip, real-installer
      # suite) need the released installer on PATH. Install it from the
      # repo's own pinned lockfile so CI runs the same release the base
      # image carries; an upgrade is a lockfile refresh, not a version bump
      # here.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docker/agent-installer/package-lock.json

      - name: Install agent-installer (pinned lockfile)
        run: cd docker/agent-installer && npm ci --no-audit --no-fund

      - name: Add agent-installer to PATH
        run: echo "${GITHUB_WORKSPACE}/docker/agent-installer/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Tests
        # The real-gateway L1 rows (marked `l1_gateway`, matrix GW-1..GW-5)
        # never run in CI: they need an operator-provided gateway and run
        # manually before each release tag and after each LiteLLM upgrade.
        # `-n auto` (pytest-xdist) spreads the suite over every runner core;
        # `--durations=15` keeps a slow-test regression visible in the log.
        run: uv run --locked pytest -q -n auto --durations=15 -m "not l1_gateway"

      - name: Validate examples/workflows.yaml
        run: uv run --locked python -m coding_agent.cli config validate --config examples/workflows.yaml

      - name: Type check
        run: uv run --locked mypy src tests

  conformance:
    name: producer conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # In-repo half of the producer suite (issue #260): schema validation
      # and harness API over the fake provider and fake GitHub. Runs here
      # too so a schema-or-harness regression fails before Docker starts.
      - name: In-repo conformance
        run: uv run --locked pytest -q tests/test_conformance_schemas.py tests/test_conformance_harness.py

      # Drift gate: a deliberate contract deviation must fail validation.
      - name: Drift gate
        run: ./conformance/check-drift.sh

      # Image half: real process death, docker exec/run, the read-only
      # root filesystem, the labels and the socket permissions, against
      # the built base image. Needs the daemon, so it lives in this job and
      # not in the daemon-less `check` job above.
      - name: Producer suite against the built base image
        run: ./conformance/producer-suite.sh --image coding-agent:base
