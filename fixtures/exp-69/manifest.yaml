# Frozen fixtures for the declared-completion experiment (#69), built in #201.
#
# Every path below is relative to this directory. `base.tree` is the vendored
# copy of the Base Revision tagged in the sandbox Target Repository; the
# oracle, reference, partial and unwanted trees live beside it and are never
# part of it. `scripts/exp-69-protocol-fixtures.py` renders the `fixtures`
# section of the experiment protocol from this file, with each oracle file's
# content inlined as the harness expects.
base:
  repository: lbacik/coding-agent-sandbox
  branch: exp-69-base
  tag: exp-69-base-v1
  commit: null
  tree_object: null
  tree: base
  derived_from: fixtures/l2/python (ADR 0006), with the deliberately red test fixed and a .gitignore added

fixtures:
  - id: f1-silent-stop
    kind: silent-stop
    title: "Add an optional `exclamations` count to `shout`"
    body: issues/f1-silent-stop.md
    criteria: 4
    issue_number: null
    issue_body_digest: null
    oracle:
      command: [uv, run, --no-project, --python, "3.13", --, python, -I, _oracle/f1_silent_stop.py]
      files:
        _oracle/f1_silent_stop.py: oracles/f1_silent_stop.py
    reference: reference/f1-silent-stop
    partial:
      - partial/f1-no-validation
      - partial/f1-changed-greet

