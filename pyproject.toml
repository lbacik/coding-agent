[project]
name = "coding-agent"
version = "0.5.2"
description = "Containerised agent that implements Target Repository issues and hands back a pull request."
requires-python = ">=3.13"
dependencies = [
    "httpx==0.29.0",
    "langchain==1.5.2",
    "langchain-anthropic==1.7.13",
    "langchain-openai==1.8.5",
    "langgraph==1.2.24",
    "pyyaml==6.0.4",
    "requests>=2.32",
]

[project.scripts]
agent = "coding_agent.cli:main"
agentctl = "coding_agent.agentctl:main"

[dependency-groups]
dev = [
    "agent-operator-contract @ git+https://github.com/lbacik/agent-operator-contract@v1.2.0",
    "jsonschema==4.25.1",
    "mypy>=1.11",
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "requests-mock>=1.12",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "l1_gateway: real-gateway L1 rows (GW-1..GW-5); skipped without TEST_GATEWAY_* env vars, never run in CI",
]

[tool.mypy]
python_version = "3.13"
strict = true
