[project]
name = "coding-agent"
version = "0.1.0"
description = "Containerised agent that implements Target Repository issues and hands back a pull request."
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
agent = "coding_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "requests-mock>=1.12",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
