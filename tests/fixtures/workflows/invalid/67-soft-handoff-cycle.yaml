# PROTOTYPE invalid case (#608): the soft receiver's fallback chain must not cycle, even bounded by an Execution Ceiling
# expect: form a cycle
version: 4
target: {kind: github, repository: OWNER/REPO, base-branch: main, token-env: GITHUB_TOKEN}
models:
  sonnet: {provider: anthropic, model: claude-sonnet-5, endpoint: messages, effort: medium, api-key-env: ANTHROPIC_API_KEY,
           prices-usd-per-mtok: {input: 2.0, output: 10.0, cache-read: 0.2, cache-write: 2.5}, context-window-tokens: 1000000, context-threshold-tokens: 80000, output-cap-tokens: 32000}
workflows:
  review:
    model: sonnet
    input: {type: issue, label: agent:review}
    limits: {cost-usd: 6, effective-tokens: 1500000, tool-calls: 300, wall-clock-minutes: 30}
    start: process
    defaults:
      max-executions: 1
      routes: {error: {end: failed}, limit-exceeded: {end: unfinished}}
    steps:
      process:
        agent:
          tools: [workspace-read]
          results:
            done: {}
        context-thresholds: {hard-tokens: 40000, soft-tokens: 20000}
        routes: {done: {end: completed}, hard-context-threshold: {end: unfinished}, soft-context-threshold: {step: scribe, inherit-conversation: true}}
      scribe:
        agent:
          tools: [workspace-read]
          results:
            note: {}
        reserved: true
        limits: {cost-usd: 2, effective-tokens: 200000, tool-calls: 100, wall-clock-minutes: 10}
        context-thresholds: {hard-tokens: 40000}
        routes: {note: {end: completed}, hard-context-threshold: {end: unfinished}, error: guard-one}
      guard-one:
        operation: commit-and-push
        routes: {pushed: guard-two, no-changes: {end: unfinished}}
      guard-two:
        operation: commit-and-push
        routes: {pushed: guard-one, no-changes: {end: unfinished}}
