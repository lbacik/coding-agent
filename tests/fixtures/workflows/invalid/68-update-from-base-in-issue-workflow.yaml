# PROTOTYPE invalid case (#636): update-from-base used in an issue Workflow
# expect: available only in `pull-request` Workflows
version: 4
target: {kind: github, repository: OWNER/REPO, base-branch: main, token-env: GITHUB_TOKEN}
models:
  sonnet: {provider: anthropic, model: claude-sonnet-5, endpoint: messages, effort: medium, api-key-env: ANTHROPIC_API_KEY,
           prices-usd-per-mtok: {input: 2.0, output: 10.0, cache-read: 2.5, cache-write: 2.5}, context-window-tokens: 1000000, context-threshold-tokens: 80000, output-cap-tokens: 32000}
workflows:
  implement:
    model: sonnet
    input: {type: issue, label: agent:implement}
    limits: {cost-usd: 6, effective-tokens: 1500000, tool-calls: 300, wall-clock-minutes: 30}
    start: sync
    defaults:
      max-executions: 1
      routes: {error: {end: failed}, limit-exceeded: {end: unfinished}}
    steps:
      sync:
        operation: update-from-base
        routes: {merged: push, conflicted: {end: failed}, up-to-date: push}
      push:
        operation: commit-and-push
        routes: {pushed: {end: completed}, no-changes: {end: completed}}
