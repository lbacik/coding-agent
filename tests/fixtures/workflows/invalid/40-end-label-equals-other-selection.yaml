# S1 (CFG-43): an end label equal to another Workflow's Selection Label.
# expect: never applies a Selection Label
version: 3
target: {kind: github, repository: OWNER/REPO, base-branch: main, token-env: GITHUB_TOKEN}
models:
  sonnet: {provider: anthropic, model: claude-sonnet-5, endpoint: messages, effort: medium, api-key-env: ANTHROPIC_API_KEY,
           prices-usd-per-mtok: {input: 2.0, output: 10.00, cache-read: 0.2, cache-write: 2.5}}
workflows:
  review:
    model: sonnet
    input: {type: pull-request, label: agent:review}
    limits: {cost-usd: 6, tokens: 1500000, tool-calls: 300, wall-clock-minutes: 30}
    outcomes: {failed: {labels: [agent:implement]}}
    start: review
    defaults:
      max-executions: 1
      routes: {error: {end: failed}, limit-exceeded: {end: unfinished}}
    steps:
      review:
        agent:
          tools: [workspace-read]
          results:
            reviewed: {body: document}
        routes: {reviewed: publish}
      publish:
        operation: publish-review
        with: {body: review.reviewed.body}
        routes: {published: {end: completed}, stale-head: {end: failed}}
  implement:
    model: sonnet
    input: {type: issue, label: agent:implement}
    limits: {cost-usd: 6, tokens: 1500000, tool-calls: 300, wall-clock-minutes: 30}
    start: work
    defaults:
      max-executions: 1
      routes: {error: {end: failed}, limit-exceeded: {end: failed}}
    steps:
      work:
        operation: check-readiness
        routes: {ready: {end: completed}, not-ready: {end: blocked}}
