# One-shot commands run with `docker compose run --rm <service> [args...]`;
# the `worker` service is the one long-running process (`agent run`).
#
# Every service below is the same container the README documents by hand —
# read-only root filesystem, writable /tmp, one named volume at
# /var/lib/coding-agent — so nothing here grants the agent anything the
# plain `docker run` invocations do not.
name: coding-agent

x-agent: &agent
  build: .
  image: coding-agent:dev
  # The image deliberately declares no entrypoint (its verification scripts
  # run `bash` inside it); compose fixes one so a service's arguments read
  # as the agent's own subcommand.
  entrypoint: ["agent"]
  read_only: true
  tmpfs:
    - /tmp
  # Names only, never values: the credential comes from the shell or from
  # the .env compose reads beside this file. GITHUB_TOKEN is the default
  # the CLI looks for; SANDBOX_TOKEN is passed through so a sandbox
  # credential can be selected with `--token-env SANDBOX_TOKEN` rather than
  # copied under a second name.
  environment:
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
  volumes:
    - state:/var/lib/coding-agent

services:
  # The general-purpose seat. Everything the CLI can do, with the
  # subcommand supplied at the command line:
  #
  #   docker compose run --rm agent startup-check --repo <owner>/<repo>
  #   docker compose run --rm agent verify-skill-bundle --help
  agent:
    <<: *agent
    command: ["--help"]

  # Validates one checkout against its own Project Profile. The checkout is
  # mounted writable, because `bootstrap` installs into it; evidence is
  # written to the volume, not into the project.
  #
  #   TARGET_PROJECT=../my-project docker compose run --rm validate
  #
  # Defaults to this repository's Python L2 fixture, so the service is
  # runnable — and demonstrably real — with no variable set at all.
  validate:
    <<: *agent
    volumes:
      - state:/var/lib/coding-agent
      - ${TARGET_PROJECT:-./fixtures/l2/python}:/var/lib/coding-agent/workspaces/target
    # The two paths sit in the entrypoint rather than in `command` so that
    # arguments given to `docker compose run` are appended to them instead
    # of replacing them:
    #
    #   docker compose run --rm validate --skip-bootstrap \
    #     --targeted tests/test_greeting.py
    entrypoint:
      - agent
      - validate
      - --project-dir
      - /var/lib/coding-agent/workspaces/target
      - --evidence-dir
      - /var/lib/coding-agent/artifacts/target
    command: []

  # The Worker (step-workflow contract §4): `agent run` against the
  # operator's `version: 2` Workflow Configuration. It selects, claims and
  # runs the selected Workflow's inputs one Attempt at a time until it halts; a startup refusal or a
  # halt exits non-zero, and it is never restarted automatically, so a
  # Credential Failure cannot loop.
  #
  #   WORKFLOW_CONFIG_DIR=./tmp/workflow docker compose up worker
  #
  # WORKFLOW_CONFIG_DIR holds `workflow.yml` and any prompt files it names;
  # it is mounted read-only. WORKFLOW selects the Workflow id (default
  # `implement`). The token variable the YAML's `target.token-env` names
  # and the model's `api-key-env` must be among the names passed below.
  worker:
    <<: *agent
    restart: "no"
    # Discovery labels (operator contract §2.1, adoption step 4, #245): they
    # make this container — and only this one — a Managed Instance. Set
    # through the deployment, never as an image LABEL: the image is shared
    # with the one-off `agent` and `validate` services. AGENT_INSTANCE_NAME
    # falls back to `coding-agent`, so the service is discoverable with
    # nothing set.
    labels:
      io.github.lbacik.agent-operator.contract: "1"
      io.github.lbacik.agent-operator.instance: ${AGENT_INSTANCE_NAME:-coding-agent}
      io.github.lbacik.agent-operator.exec-user: "agent"
      io.github.lbacik.agent-operator.backend: "coding-agent"
    # PID 1 in the image ignores SIGTERM without an installed handler, so
    # the Worker installs one explicitly at startup (contract §12) and
    # this init forwards the signal as well. `stop_grace_period` must stay
    # above `worker.shutdown-grace-seconds` (default 30 s), or Docker would
    # SIGKILL the Worker mid-finalisation.
    init: true
    stop_grace_period: 60s
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - state:/var/lib/coding-agent
      - ${WORKFLOW_CONFIG_DIR:-./tmp/workflow}:/etc/coding-agent:ro
    # The operator control socket directory (adoption step 4, #248): a
    # tmpfs mount shadowing the state volume's `operator` subdirectory, so
    # the Unix socket never touches the named volume. Only the worker
    # carries it; `agent` and `validate` keep the base `/tmp` tmpfs alone.
    # The listener enforces 0700 on the directory and 0600 on the socket;
    # there is no network listener and no published port.
    tmpfs:
      - /tmp
      - /var/lib/coding-agent/operator
    command:
      - run
      - --config
      - /etc/coding-agent/workflow.yml
      - --workflow
      - ${WORKFLOW:-implement}

volumes:
  state:
