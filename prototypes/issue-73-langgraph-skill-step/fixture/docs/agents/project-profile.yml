# Issue #73 prototype fixture, copied from fixtures/l2/python with the deliberately red test removed (a red baseline is a refusal, P-RDY-4).
schema: 2
language: python
working_directory: "."
toolchain:
  python: "3.13"
  package_manager: uv
commands:
  bootstrap: uv sync --frozen
  test_all: uv run pytest -q --junit-xml={evidence_dir}/test_all.xml
  test_targeted: uv run pytest -q --junit-xml={evidence_dir}/test_targeted.xml {path}
evidence:
  format: junit-xml
  test_all: "{evidence_dir}/test_all.xml"
  test_targeted: "{evidence_dir}/test_targeted.xml"
checks: none
